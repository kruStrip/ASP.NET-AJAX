services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: muzloto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: muzloto_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - muzloto_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muzloto -d muzloto_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  muzloto_pgdata:
