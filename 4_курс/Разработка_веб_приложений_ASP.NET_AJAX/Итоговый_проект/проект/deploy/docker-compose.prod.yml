# МузЛото on the shared server. Secrets come from deploy/.env on the server (never committed).
# The app joins the existing reverse proxy network (calendar's nginx) under the alias "muzloto-app";
# the database is reachable only from the app.
name: muzloto
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: muzloto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: muzloto
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=30"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muzloto -d muzloto"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 192m
    networks: [internal]

  app:
    # Set by the deploy scripts in .env: ghcr.io/krustrip/muzloto-web (CI) or muzloto-web (manual deploy.sh).
    image: ${MUZLOTO_IMAGE:-muzloto-web}:${MUZLOTO_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=muzloto;Username=muzloto;Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${MUZLOTO_JWT_KEY:?set in .env}
      Integration__Secret: ${MUZLOTO_INTEGRATION_SECRET:?set in .env}
      BootstrapAdmin__Email: ${MUZLOTO_ADMIN_EMAIL:?set in .env}
      BootstrapAdmin__Password: ${MUZLOTO_ADMIN_PASSWORD:?set in .env}
      ForwardedHeaders__Enabled: "true"
      Site__PublicUrl: https://muzloto.b-o-c-a.ru
      # «Ваша игра подтверждена» goes through the Wazzup cloud service; the company connects its WhatsApp
      # number and Telegram account in the Wazzup web interface. Empty API key = not connected yet.
      # Channel ids are optional: without them the only channel of the matching type in Wazzup is used.
      Wazzup__ApiKey: ${WAZZUP_API_KEY:-}
      Wazzup__WhatsAppChannelId: ${WAZZUP_WHATSAPP_CHANNEL_ID:-}
      Wazzup__TelegramChannelId: ${WAZZUP_TELEGRAM_CHANNEL_ID:-}
      # Managers' notifications go to a Telegram group topic through our own bot (BotFather token):
      # «Подтвердить игру» for a new receipt, «Связаться с клиентом» when the customer got nothing,
      # «Изменения в бронях» for a staff edit, «Отмена игр» for a cancelled booking.
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
      Telegram__ManagerChatId: ${TELEGRAM_MANAGER_CHAT_ID:-}
      Telegram__ManagerTopicId: ${TELEGRAM_MANAGER_TOPIC_ID:-}
      Telegram__ContactTopicId: ${TELEGRAM_CONTACT_TOPIC_ID:-}
      Telegram__ChangesTopicId: ${TELEGRAM_CHANGES_TOPIC_ID:-}
      Telegram__CancelTopicId: ${TELEGRAM_CANCEL_TOPIC_ID:-}
      # Telegram Bot API is blocked for this hosting: the calls go through a small Cloudflare Worker
      # (deploy/cloudflare-worker). Empty TELEGRAM_API_BASE_URL = call api.telegram.org directly.
      Telegram__ApiBaseUrl: ${TELEGRAM_API_BASE_URL:-}
      Telegram__RelaySecret: ${TELEGRAM_RELAY_SECRET:-}
    volumes:
      - appdata:/data
    mem_limit: 320m
    networks:
      internal: {}
      proxy:
        aliases: [muzloto-app]

volumes:
  pgdata:
  appdata:

networks:
  internal: {}
  proxy:
    external: true
    name: deploy_calendar-network
