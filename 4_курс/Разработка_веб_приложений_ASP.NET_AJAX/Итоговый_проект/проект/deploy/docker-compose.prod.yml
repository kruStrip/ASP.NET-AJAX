# МузЛото on the shared server. Secrets come from deploy/.env on the server (never committed).
# The app joins the existing reverse proxy network (calendar's nginx) under the alias "muzloto-app";
# the database is reachable only from the app.
name: muzloto
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: muzloto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: muzloto
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=30"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muzloto -d muzloto"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 192m
    networks: [internal]

  app:
    # Set by the deploy scripts in .env: ghcr.io/krustrip/muzloto-web (CI) or muzloto-web (manual deploy.sh).
    image: ${MUZLOTO_IMAGE:-muzloto-web}:${MUZLOTO_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=muzloto;Username=muzloto;Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${MUZLOTO_JWT_KEY:?set in .env}
      Integration__Secret: ${MUZLOTO_INTEGRATION_SECRET:?set in .env}
      BootstrapAdmin__Email: ${MUZLOTO_ADMIN_EMAIL:?set in .env}
      BootstrapAdmin__Password: ${MUZLOTO_ADMIN_PASSWORD:?set in .env}
      ForwardedHeaders__Enabled: "true"
      Site__PublicUrl: https://muzloto.b-o-c-a.ru
      # Customer messages after a confirmed payment. Empty values = the messenger is simply not connected yet.
      Messaging__DataPath: /data/messengers
      Telegram__ApiId: ${TELEGRAM_API_ID:-}
      Telegram__ApiHash: ${TELEGRAM_API_HASH:-}
      Waha__Url: http://waha:3000
      Waha__ApiKey: ${WAHA_API_KEY:-}
    volumes:
      - appdata:/data
    mem_limit: 320m
    networks:
      internal: {}
      proxy:
        aliases: [muzloto-app]

  # WhatsApp gateway for the separate WhatsApp number (linked once by a QR code on «Мессенджеры»).
  # Only the app can reach it: no published ports, internal network only.
  waha:
    image: devlikeapro/waha:noweb            # browserless image: small and light
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_SWAGGER_ENABLED: "false"
      WAHA_PRINT_QR: "false"
    volumes:
      - wahadata:/app/.sessions
    mem_limit: 256m
    networks: [internal]

volumes:
  pgdata:
  appdata:
  wahadata:

networks:
  internal: {}
  proxy:
    external: true
    name: deploy_calendar-network
