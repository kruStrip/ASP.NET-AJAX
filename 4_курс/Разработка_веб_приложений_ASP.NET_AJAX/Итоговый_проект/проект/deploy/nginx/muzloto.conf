# МузЛото behind the shared nginx (project "calendar"). Installed only after the certificate exists.
map $http_upgrade $muzloto_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name muzloto.b-o-c-a.ru;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name muzloto.b-o-c-a.ru;

    ssl_certificate /etc/letsencrypt/live/muzloto.b-o-c-a.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muzloto.b-o-c-a.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/muzloto-access.log;
    error_log /var/log/nginx/muzloto-error.log;

    # Resolve the app lazily through Docker DNS: if the МузЛото container is down this site answers 502,
    # but nginx (and the calendar site) keeps starting and reloading normally.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $muzloto_upstream http://muzloto-app:8080;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # The app sends its own CSP, HSTS and other security headers.
    location / {
        proxy_pass $muzloto_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;          # SignalR WebSockets
        proxy_set_header Connection $muzloto_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;                          # long-polling fallback
        proxy_send_timeout 60s;
    }
}
