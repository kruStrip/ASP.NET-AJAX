# Phase 1: only the ACME challenge, so Let's Encrypt can issue the certificate.
# Referencing a certificate that does not exist yet would stop the shared nginx from starting.
server {
    listen 80;
    listen [::]:80;
    server_name muzloto.b-o-c-a.ru;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
